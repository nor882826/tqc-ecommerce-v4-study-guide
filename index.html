          ["運籌管理定義", "一門規劃、組織及管理任何提供產品或服務之活動的科學。", 0],
          ["全球運籌管理定義", "以全球角度，經濟有效規劃控制原物料、半成品、製成品以及相關服務資訊的流通處理之整體管理流程，以較低成本提供服務。", 0]
        ]}
      ]
    }
  ];

  document.getElementById("brand-name").textContent = CONFIG.pageTitle;
  document.getElementById("hero-eyebrow").textContent = CONFIG.courseName + "・備課參考";

  var totalQuestions = 0, totalSub = 0, totalLeaf = 0, totalHot = 0;
  DATA.forEach(function (cat) {
    totalQuestions += cat.count;
    cat.subtopics.forEach(function (sub) {
      totalSub++;
      sub.points.forEach(function (p) { totalLeaf++; if (p[2]) totalHot++; });
    });
  });

  document.getElementById("stat-line").textContent = DATA.length + "大類・" + totalSub + "子主題・共" + totalQuestions + "題";
  document.getElementById("hero-title").textContent =
    CONFIG.heroTitle || ("把 " + totalQuestions + " 題題庫，整理成可以直接拿去排課的大綱");
  document.getElementById("hero-desc").textContent =
    CONFIG.heroDesc || ("依 " + DATA.length + " 大類、" + totalSub + " 個子主題整理知識點，附建議授課比重，帶 ★ 的是題庫中特別容易混淆或高頻出現的重點，排課時可以多留一點時間。");
  document.getElementById("page-footer").innerHTML =
    "資料來源：" + escapeHtml(CONFIG.sourceNote) + "（" + escapeHtml(CONFIG.courseCode) + "）題目解析內容整理，共 " + totalQuestions + " 題。知識點文字為AI依題庫內容摘要整理，正式授課前建議對照原始題目複核。";

  var jumpnav = document.getElementById("jumpnav");

  var overviewChip = document.createElement("button");
  overviewChip.type = "button";
  overviewChip.className = "jumpchip";
  overviewChip.setAttribute("data-tab", "overview");
  overviewChip.textContent = "總覽";
  jumpnav.appendChild(overviewChip);

  DATA.forEach(function (cat, i) {
    var a = document.createElement("button");
    a.type = "button";
    a.className = "jumpchip";
    a.setAttribute("data-tab", String(i));
    a.innerHTML = '<span class="dot" style="background:var(--' + cat.key + ')"></span>' + (i + 1) + ". " + escapeHtml(cat.short || cat.name);
    jumpnav.appendChild(a);
  });

  var planTable = document.getElementById("plan-table");
  var header = document.createElement("div");
  header.className = "plan-row";
  header.innerHTML = "<span></span><span>單元</span><span class='num'>題數</span><span class='num'>比重</span><span class='num'>子主題</span><span class='num'>重點★</span><span class='num'>建議時數</span>";
  planTable.appendChild(header);

  var hoursCells = [];

  DATA.forEach(function (cat, i) {
    var hotCount = 0, subCount = cat.subtopics.length;
    cat.subtopics.forEach(function (s) { s.points.forEach(function (p) { if (p[2]) hotCount++; }); });
    var fraction = totalQuestions ? cat.count / totalQuestions : 0;
    var pct = Math.round(fraction * 100);

    var row = document.createElement("a");
    row.className = "plan-row";
    row.href = "#unit-" + i;
    row.setAttribute("data-tab", String(i));
    row.innerHTML =
      '<span class="dot" style="background:var(--' + cat.key + ')"></span>' +
      '<span class="name">' + (i + 1) + ". " + escapeHtml(cat.name) + "</span>" +
      '<span class="num">' + cat.count + "題</span>" +
      '<span class="num">約 ' + pct + "%</span>" +
      '<span class="num">' + subCount + "</span>" +
      '<span class="num">' + hotCount + "</span>" +
      '<span class="num hours-cell">—</span>';
    planTable.appendChild(row);
    hoursCells.push({ el: row.querySelector(".hours-cell"), fraction: fraction });

    var bar = document.createElement("div");
    bar.className = "weightbar";
    bar.innerHTML = '<span style="width:' + pct + '%; background:var(--' + cat.key + ')"></span>';
    planTable.appendChild(bar);
  });

  var hoursInput = document.getElementById("hours-input");
  hoursInput.addEventListener("input", function () {
    var total = parseFloat(hoursInput.value);
    var valid = !isNaN(total) && total > 0;
    if (!valid) {
      hoursCells.forEach(function (c) { c.el.textContent = "—"; });
      return;
    }
    var totalSlots = Math.max(0, Math.round(total * 2));
    var raw = hoursCells.map(function (c) { return c.fraction * totalSlots; });
    var base = raw.map(Math.floor);
    var used = base.reduce(function (a, b) { return a + b; }, 0);
    var remainder = totalSlots - used;
    var order = raw
      .map(function (v, i) { return { i: i, frac: v - base[i] }; })
      .sort(function (a, b) { return b.frac - a.frac; });
    for (var k = 0; k < remainder && k < order.length; k++) { base[order[k].i]++; }
    hoursCells.forEach(function (c, i) { c.el.textContent = (base[i] * 0.5).toFixed(1) + "h"; });
  });

  var unitsEl = document.getElementById("units");
  DATA.forEach(function (cat, ci) {
    var section = document.createElement("section");
    section.className = "unit";
    section.id = "unit-" + ci;
    section.style.setProperty("--u-color", "var(--" + cat.key + ")");
    section.style.setProperty("--u-tint", "var(--" + cat.key + "-tint)");

    var head = document.createElement("div");
    head.className = "unit-head";
    var subCount = cat.subtopics.length;
    head.innerHTML =
      '<span class="idx">' + (ci + 1) + "</span>" +
      "<h2>" + escapeHtml(cat.name) + "</h2>" +
      '<span class="unit-meta">' + cat.count + "題・" + subCount + "個子主題</span>" +
      '<button class="unit-copy" data-ci="' + ci + '">複製本單元大綱</button>';
    section.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "subgrid";
    cat.subtopics.forEach(function (sub) {
      var card = document.createElement("div");
      card.className = "subcard";
      var h3 = document.createElement("h3");
      h3.textContent = sub.name;
      card.appendChild(h3);
      var ul = document.createElement("ul");
      sub.points.forEach(function (p) {
        var terms = p[3];
        var li = document.createElement("li");
        li.className = "pt" + (p[2] ? " hot" : "") + (terms ? " expandable" : "");
        var termsText = terms ? terms.map(function (t) { return t[0] + " " + t[1]; }).join(" ") : "";
        li.setAttribute("data-text", (p[0] + " " + p[1] + " " + termsText).toLowerCase());
        li.innerHTML =
          '<div class="pt-row">' +
          (p[2] ? '<span class="star">★</span>' : "") +
          "<b>" + escapeHtml(p[0]) + "</b>　" + escapeHtml(p[1]) +
          (terms ? '<span class="expand-mark" aria-hidden="true">展開<span class="chev">▾</span></span>' : "") +
          "</div>";
        if (terms) {
          var sub2 = document.createElement("ul");
          sub2.className = "sub-terms";
          terms.forEach(function (t) {
            var li2 = document.createElement("li");
            li2.innerHTML = "<b>" + escapeHtml(t[0]) + "</b>　" + escapeHtml(t[1]);
            sub2.appendChild(li2);
          });
          li.appendChild(sub2);
          li.setAttribute("tabindex", "0");
          li.setAttribute("role", "button");
          li.setAttribute("aria-expanded", "false");
          li.addEventListener("click", function () { toggleExpand(li); });
          li.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggleExpand(li); }
          });
        }
        ul.appendChild(li);
      });
      card.appendChild(ul);
      grid.appendChild(card);
    });
    section.appendChild(grid);
    unitsEl.appendChild(section);
  });

  var currentTab = "overview";

  function setActiveTab(tabId, opts) {
    opts = opts || {};
    currentTab = tabId;
    var isOverview = tabId === "overview";

    document.body.classList.toggle("tab-single", !isOverview);

    DATA.forEach(function (cat, i) {
      var el = document.getElementById("unit-" + i);
      var show = isOverview || String(i) === String(tabId);
      el.style.display = show ? "" : "none";
      el.classList.toggle("single", !isOverview && show);
    });

    Array.prototype.forEach.call(jumpnav.querySelectorAll(".jumpchip"), function (chip) {
      chip.classList.toggle("active", chip.getAttribute("data-tab") === String(tabId));
    });

    if (!opts.skipHash) {
      history.replaceState(null, "", "#" + (isOverview ? "overview" : "unit-" + tabId));
    }
    applySearchFilter();
    if (!opts.skipScroll) window.scrollTo({ top: 0, behavior: "auto" });
  }

  document.addEventListener("click", function (e) {
    var tabEl = e.target.closest("[data-tab]");
    if (tabEl) {
      e.preventDefault();
      setActiveTab(tabEl.getAttribute("data-tab"));
    }
  });

  document.getElementById("btn-back").addEventListener("click", function () {
    setActiveTab("overview");
  });

  function initTabFromHash() {
    var h = location.hash.replace("#", "");
    var m = h.match(/^unit-(\d+)$/);
    if (m && DATA[parseInt(m[1], 10)]) {
      setActiveTab(m[1], { skipHash: true, skipScroll: true });
    } else {
      setActiveTab("overview", { skipHash: true, skipScroll: true });
    }
  }

  function toggleExpand(li) {
    var isOpen = li.classList.toggle("expanded");
    li.setAttribute("aria-expanded", isOpen ? "true" : "false");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function outlineText(ci) {
    var cat = DATA[ci];
    var lines = [cat.name + "（" + cat.count + "題）", ""];
    cat.subtopics.forEach(function (sub) {
      lines.push("■ " + sub.name);
      sub.points.forEach(function (p) {
        lines.push("　" + (p[2] ? "★ " : "・") + p[0] + "：" + p[1]);
        if (p[3]) {
          p[3].forEach(function (t) { lines.push("　　- " + t[0] + "：" + t[1]); });
        }
      });
      lines.push("");
    });
    return lines.join("\n");
  }
  function copyText(text, btn) {
    var done = function () {
      var old = btn.textContent;
      btn.textContent = "已複製 ✓";
      setTimeout(function () { btn.textContent = old; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(function () { fallbackCopy(text); done(); });
    } else {
      fallbackCopy(text); done();
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }

  document.addEventListener("click", function (e) {
    var btn = e.target.closest(".unit-copy");
    if (btn) copyText(outlineText(parseInt(btn.getAttribute("data-ci"), 10)), btn);
  });

  document.getElementById("btn-copyall").addEventListener("click", function (e) {
    var all = DATA.map(function (_, i) { return outlineText(i); }).join("\n");
    copyText(CONFIG.courseName + "　備課大綱\n\n" + all, e.currentTarget);
  });

  var termsExpanded = false;
  document.getElementById("btn-expand-terms").addEventListener("click", function (e) {
    termsExpanded = !termsExpanded;
    e.currentTarget.textContent = termsExpanded ? "▴ 收合全部名詞說明" : "▾ 展開全部名詞說明";
    Array.prototype.forEach.call(document.querySelectorAll(".subcard li.expandable"), function (li) {
      li.classList.toggle("expanded", termsExpanded);
      li.classList.remove("auto-expanded");
      li.setAttribute("aria-expanded", termsExpanded ? "true" : "false");
    });
  });

  var hotOn = false;
  document.getElementById("btn-hot").addEventListener("click", function (e) {
    hotOn = !hotOn;
    e.currentTarget.classList.toggle("active", hotOn);
    Array.prototype.forEach.call(document.querySelectorAll(".subcard li.pt"), function (li) {
      li.classList.toggle("pt-dim", hotOn && !li.classList.contains("hot"));
    });
  });

  var searchInput = document.getElementById("search");

  function applySearchFilter() {
    var q = searchInput.value.trim().toLowerCase();
    var anyMatch = false;
    var isOverview = currentTab === "overview";

    DATA.forEach(function (cat, i) {
      var unit = document.getElementById("unit-" + i);
      var tabEligible = isOverview || String(i) === String(currentTab);
      if (!tabEligible) return;

      var unitHasMatch = false;
      Array.prototype.forEach.call(unit.querySelectorAll(".subcard"), function (card) {
        var cardHasMatch = false;
        Array.prototype.forEach.call(card.querySelectorAll("li.pt"), function (li) {
          var isMatch = q && li.getAttribute("data-text").indexOf(q) !== -1;
          li.classList.toggle("pt-match", !!isMatch);
          li.classList.toggle("pt-dim", !!q && !isMatch);
          if (isMatch) {
            cardHasMatch = true;
            anyMatch = true;
            if (li.classList.contains("expandable") && !li.classList.contains("expanded")) {
              li.classList.add("expanded", "auto-expanded");
              li.setAttribute("aria-expanded", "true");
            }
          } else if (li.classList.contains("auto-expanded")) {
            li.classList.remove("expanded", "auto-expanded");
            li.setAttribute("aria-expanded", "false");
          }
        });
        card.style.display = (!q || cardHasMatch) ? "" : "none";
        if (cardHasMatch) unitHasMatch = true;
      });

      if (isOverview) unit.style.display = (!q || unitHasMatch) ? "" : "none";
    });

    document.getElementById("no-results").style.display = (q && !anyMatch) ? "block" : "none";
    document.getElementById("no-results-q").textContent = q;
  }

  searchInput.addEventListener("input", applySearchFilter);

  initTabFromHash();
})();
</script>
